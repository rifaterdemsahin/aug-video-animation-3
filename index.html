<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback — CODE Pipeline</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body data-active-page="feedback">
  <div class="app-layout">
    <main class="main-content-area feedback-main">
      <div class="feedback-board-bar">
        <a href="https://www.canva.com/design/DAHTV1XbvSs/xCsQKBeG5DDTyOxMwafRgw/view" target="_blank" rel="noopener">Open in Canva ↗</a>
      </div>
      <section class="canva-whiteboard-full">
        <iframe loading="lazy" src="https://www.canva.com/design/DAHTV1XbvSs/xCsQKBeG5DDTyOxMwafRgw/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen" title="Canva production whiteboard"></iframe>
      </section>
    </main>
    <aside class="lhs-sidebar app-sidebar">
      <div class="app-sidebar-header">
        <a href="pipeline.html" class="rhs-brand">
          <div class="rhs-brand-icon">✨</div>
          <div class="rhs-brand-text">
            <h1>3-Min Video Engine</h1>
            <p>CODE Pipeline</p>
          </div>
        </a>
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Switch to Light Mode" aria-label="Toggle Light / Dark Mode">
          <span class="theme-icon">☀️</span>
          <span class="theme-label">Light Mode</span>
        </button>
      </div>
      <div class="rhs-status-card">
        <div class="rhs-status-header">
          <span style="font-size:0.75rem; font-weight:700; color:var(--text-main);">🎬 Production Progress</span>
          <span id="stat-completed-scenes" style="font-size:0.7rem; font-family:var(--font-mono); color:var(--accent-cyan);">0/22 Ready</span>
        </div>
        <div class="progress-bar-container" style="height: 6px;">
          <div id="global-progress-fill" class="progress-bar-fill"></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
          <span id="azure-last-sync-time" style="font-size:0.65rem; color:var(--text-muted);">Azure Synced</span>
          <button class="btn btn-cloud btn-sm" style="padding:2px 8px; font-size:0.7rem;" onclick="pushStateToAzure(true)">☁️ Sync Azure</button>
        </div>
      </div>
      <nav class="rhs-nav-groups"></nav>
      <div class="rhs-footer-actions">
        <a href="https://www.canva.com/design/DAHTV1XbvSs/xCsQKBeG5DDTyOxMwafRgw/view" target="_blank" rel="noopener" class="btn btn-primary btn-sm" style="justify-content:center;">🎨 Open Canva Whiteboard</a>
        <a href="https://github.com/rifaterdemsahin/aug-video-animation-3" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm" style="justify-content:center;">🐙 GitHub ↗</a>
      </div>
    </aside>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
